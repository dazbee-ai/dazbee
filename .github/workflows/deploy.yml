name: Deploy

# Puts a commit live on the server with deploy/deploy.sh (ADR-0017): each push to main once CI has
# passed on it, by which time its images are in the registry, or a commit given by hand, which is also
# how to roll back. It runs only while the repo variable DEPLOY_ENABLED is `true`.
#
# Its secrets come from the GitHub environment `production`, which only main may deploy from. To make
# it: Settings > Environments > New environment, named `production`; under Deployment branches and
# tags pick Selected branches and tags and add the branch `main`; then add the environment secrets
# DEPLOY_HOST (the server's address), DEPLOY_SSH_KEY (the deploy user's private key) and
# DEPLOY_KNOWN_HOSTS (`ssh-keyscan` of the server). deploy/setup.sh says how the server is set up.
#
# The server's .env comes from the same environment: each setting deploy/env.example lists is one of its
# secrets, by the same name, or one of its variables when the value is neither secret nor personal (a client
# id, a bucket's name), since GitHub hides a secret's value wherever it appears in a log. Each deploy writes
# the .env from them with deploy/env-file.sh, which refuses when a setting compose.yml requires is not set,
# and deploy.sh puts it in place. To change a setting, change it there and run this workflow by hand with
# the commit that is live.
#
# The job `layering` deploys the layer split app (python/layering) to Modal with `modal deploy`, when a
# commit changes python/layering, or by hand, while the repo variable MODAL_DEPLOY is `on`. Its token is
# the `production` environment's secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET, and it deploys to the Modal
# environment the variable MODAL_ENVIRONMENT names, `prod` unless set, as the worker calls it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: The full commit id to deploy; CI must have pushed its images.
        required: true
        type: string

# One deploy at a time: one in flight is never cancelled, and the newest waiting one runs after it.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 40
    env:
      COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.event.workflow_run.head_sha }}
    steps:
      # After CI, only main's newest commit is deployed: a CI run started again later for an older
      # commit would otherwise put it back live.
      - name: Check the commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ $COMMIT =~ ^[0-9a-f]{40}$ ]] || {
            echo 'The commit must be a full commit id: 40 lowercase hex digits.' >&2
            exit 1
          }
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$tip" != "$COMMIT" ]; then
              echo "::notice::$COMMIT is no longer main's newest commit, so it is not deployed."
              echo skip=true >> "$GITHUB_OUTPUT"
            fi
          fi
      # The deploy/ folder of the commit deployed, so a rollback runs with its own compose file.
      - if: steps.commit.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}
      # The server's address, key and host key are secrets, so the logs show them masked; ssh names
      # the server only as `server`, and says nothing below an error.
      - if: steps.commit.outputs.skip != 'true'
        name: Connect to the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config << EOF
          Host server
            HostName $DEPLOY_HOST
            User deploy
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            LogLevel ERROR
            ServerAliveInterval 15
          EOF
      # A deploy still running on the server, after a job that was cancelled or lost its connection,
      # finishes first.
      - if: steps.commit.outputs.skip != 'true'
        name: Wait for a deploy still running
        run: ssh server 'mkdir -p /opt/dazbee/live && flock -w 900 /opt/dazbee/live/deploy.lock true'
      # deploy.sh puts this copy in place over deploy/ once no other deploy runs.
      - if: steps.commit.outputs.skip != 'true'
        name: Copy deploy/
        run: |
          tar -C deploy -cf - . |
            ssh server 'rm -rf /opt/dazbee/deploy.next && mkdir /opt/dazbee/deploy.next && tar -xf - -C /opt/dazbee/deploy.next'
      # The .env from the environment's variables and secrets, each named here (tests/deploy/check.sh checks
      # this list against deploy/env.example), which deploy.sh puts in place once no other deploy runs. A
      # commit from before deploy/env-file.sh keeps the server's .env as it is.
      - if: steps.commit.outputs.skip != 'true'
        name: Copy the .env
        id: env
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || vars.POSTGRES_PASSWORD }}
          SYNC_TOKEN_SECRET: ${{ secrets.SYNC_TOKEN_SECRET || vars.SYNC_TOKEN_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || vars.SESSION_SECRET }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY || vars.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID || vars.WORKOS_CLIENT_ID }}
          WORKOS_REDIRECT_URI: ${{ secrets.WORKOS_REDIRECT_URI || vars.WORKOS_REDIRECT_URI }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT || vars.STORAGE_ENDPOINT }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET || vars.STORAGE_BUCKET }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID || vars.STORAGE_ACCESS_KEY_ID }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY || vars.STORAGE_SECRET_ACCESS_KEY }}
          R2_BACKUP_ENDPOINT: ${{ secrets.R2_BACKUP_ENDPOINT || vars.R2_BACKUP_ENDPOINT }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET || vars.R2_BACKUP_BUCKET }}
          R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID || vars.R2_BACKUP_ACCESS_KEY_ID }}
          R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY || vars.R2_BACKUP_SECRET_ACCESS_KEY }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS || vars.ALLOWED_EMAILS }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS || vars.ADMIN_EMAILS }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY || vars.TURNSTILE_SECRET_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY || vars.PIXABAY_API_KEY }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL || vars.SUPPORT_EMAIL }}
          PILOT_HOST: ${{ secrets.PILOT_HOST || vars.PILOT_HOST }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY || vars.TURNSTILE_SITE_KEY }}
          MCP_AGENT_TABS: ${{ secrets.MCP_AGENT_TABS || vars.MCP_AGENT_TABS }}
          MCP_AGENT_TABS_PER_ACCESS: ${{ secrets.MCP_AGENT_TABS_PER_ACCESS || vars.MCP_AGENT_TABS_PER_ACCESS }}
          MCP_SESSIONS: ${{ secrets.MCP_SESSIONS || vars.MCP_SESSIONS }}
          MCP_SESSIONS_PER_ACCESS: ${{ secrets.MCP_SESSIONS_PER_ACCESS || vars.MCP_SESSIONS_PER_ACCESS }}
          MCP_SESSION_IDLE_MINUTES: ${{ secrets.MCP_SESSION_IDLE_MINUTES || vars.MCP_SESSION_IDLE_MINUTES }}
          MCP_CALLS_BURST: ${{ secrets.MCP_CALLS_BURST || vars.MCP_CALLS_BURST }}
          MCP_CALLS_PER_SECOND: ${{ secrets.MCP_CALLS_PER_SECOND || vars.MCP_CALLS_PER_SECOND }}
          MCP_RENDERS_BURST: ${{ secrets.MCP_RENDERS_BURST || vars.MCP_RENDERS_BURST }}
          MCP_RENDER_EVERY_SECONDS: ${{ secrets.MCP_RENDER_EVERY_SECONDS || vars.MCP_RENDER_EVERY_SECONDS }}
          MCP_RENDERS_WAITING: ${{ secrets.MCP_RENDERS_WAITING || vars.MCP_RENDERS_WAITING }}
          MCP_DESIGNS_PER_HOUR: ${{ secrets.MCP_DESIGNS_PER_HOUR || vars.MCP_DESIGNS_PER_HOUR }}
          SYNC_LOADED_MB: ${{ secrets.SYNC_LOADED_MB || vars.SYNC_LOADED_MB }}
          SYNC_IDLE_DESIGNS: ${{ secrets.SYNC_IDLE_DESIGNS || vars.SYNC_IDLE_DESIGNS }}
          SYNC_IDLE_SECONDS: ${{ secrets.SYNC_IDLE_SECONDS || vars.SYNC_IDLE_SECONDS }}
          AGENT_SIGN_INS_PER_HOUR: ${{ secrets.AGENT_SIGN_INS_PER_HOUR || vars.AGENT_SIGN_INS_PER_HOUR }}
          AGENT_REGISTRATIONS_PER_HOUR: ${{ secrets.AGENT_REGISTRATIONS_PER_HOUR || vars.AGENT_REGISTRATIONS_PER_HOUR }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || vars.OPENAI_API_KEY }}
          MUSE_API_KEY: ${{ secrets.MUSE_API_KEY || vars.MUSE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || vars.OPENROUTER_API_KEY }}
          ZENMUX_API_KEY: ${{ secrets.ZENMUX_API_KEY || vars.ZENMUX_API_KEY }}
          PIXAZO_API_KEY: ${{ secrets.PIXAZO_API_KEY || vars.PIXAZO_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID || vars.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET || vars.MODAL_TOKEN_SECRET }}
          MODAL_ENVIRONMENT: ${{ secrets.MODAL_ENVIRONMENT || vars.MODAL_ENVIRONMENT }}
          OPENAI_ADMIN_API_KEY: ${{ secrets.OPENAI_ADMIN_API_KEY || vars.OPENAI_ADMIN_API_KEY }}
          OPENAI_PROJECT_ID: ${{ secrets.OPENAI_PROJECT_ID || vars.OPENAI_PROJECT_ID }}
          OPENROUTER_MANAGEMENT_API_KEY: ${{ secrets.OPENROUTER_MANAGEMENT_API_KEY || vars.OPENROUTER_MANAGEMENT_API_KEY }}
          OPENROUTER_KEY_HASH: ${{ secrets.OPENROUTER_KEY_HASH || vars.OPENROUTER_KEY_HASH }}
          ZENMUX_PLATFORM_API_KEY: ${{ secrets.ZENMUX_PLATFORM_API_KEY || vars.ZENMUX_PLATFORM_API_KEY }}
          ZENMUX_KEY_ID: ${{ secrets.ZENMUX_KEY_ID || vars.ZENMUX_KEY_ID }}
          WORKER_AI_CALLS: ${{ secrets.WORKER_AI_CALLS || vars.WORKER_AI_CALLS }}
        run: |
          [ -f deploy/env-file.sh ] || exit 0
          deploy/env-file.sh > "$RUNNER_TEMP/env"
          ssh server 'umask 077 && cat > /opt/dazbee/env.next' < "$RUNNER_TEMP/env"
          rm "$RUNNER_TEMP/env"
          echo 'option=--env env.next' >> "$GITHUB_OUTPUT"
      # deploy.sh runs on the server apart from this connection, so a cancelled job or a dropped
      # connection never stops it halfway. It logs to a file of this run's own in live/deploys/, the
      # last 20 kept; this step follows it until deploy.sh exits, then ends with its status.
      - if: steps.commit.outputs.skip != 'true'
        name: Deploy
        env:
          ENV_OPTION: ${{ steps.env.outputs.option }}
        run: |
          run="live/deploys/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          # The commit, checked above, the run's files and the process id are meant to expand here, on the runner.
          # shellcheck disable=SC2029
          pid=$(ssh server "cd /opt/dazbee && mkdir -p live/deploys && : > $run.log &&
            { ls -t live/deploys/* | tail -n +41 | xargs -r rm --;
              setsid bash -c 'bash deploy.next/deploy.sh --from deploy.next $ENV_OPTION $COMMIT > $run.log 2>&1; echo \$? > $run.status' > /dev/null 2>&1 < /dev/null & echo \$!; }")
          [[ $pid =~ ^[0-9]+$ ]]
          # shellcheck disable=SC2029
          ssh server "tail -n +1 -f --pid=$pid /opt/dazbee/$run.log"
          # shellcheck disable=SC2029
          exit "$(ssh server "cat /opt/dazbee/$run.status")"

  layering:
    if: >-
      vars.MODAL_DEPLOY == 'on' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 90
    concurrency:
      group: deploy-layering
      cancel-in-progress: false
    env:
      COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.event.workflow_run.head_sha }}
    steps:
      - name: Check the commit
        run: |
          [[ $COMMIT =~ ^[0-9a-f]{40}$ ]] || {
            echo 'The commit must be a full commit id: 40 lowercase hex digits.' >&2
            exit 1
          }
      # The commit and the one before it on main, to tell whether the app changed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 2
      - name: Check for a change to the app
        id: changed
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git diff --quiet HEAD^1 HEAD -- python/layering; then
            echo deploy=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::python/layering did not change in $COMMIT, so the layer split app is not deployed."
          fi
      - if: steps.changed.outputs.deploy == 'true'
        uses: astral-sh/setup-uv@v10.4.0
      # The image is built on Modal; a change to it, such as ComfyUI's version or the weights, builds it again.
      - if: steps.changed.outputs.deploy == 'true'
        name: Deploy to Modal
        working-directory: python/layering
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENVIRONMENT: ${{ vars.MODAL_ENVIRONMENT || 'prod' }}
        run: uv run --frozen modal deploy app.py

# Production: Caddy in front of the web app, the API, the sync server, the MCP server and Postgres 16, on one
# server.
# Run it from the folder that holds this deploy/ folder, the .env, live/ and certs/ (/opt/dazbee on
# the server), with the image tags deploy/deploy.sh keeps in live/images.env read after the .env:
#
#   docker compose -f deploy/compose.yml --project-directory . --env-file .env --env-file live/images.env up -d
#
# A plain `up` starts Caddy, the router, Postgres, the sync server and the MCP server. The web app's
# and API's colours are under the `blue` and `green` profiles, and only deploy/deploy.sh starts and
# stops them. The router needs live/upstreams.caddy, which deploy.sh writes; on a new server, start
# everything with deploy.sh, or copy deploy/upstreams.caddy into live/ first.
# Each colour's image tag comes from WEB_BLUE_TAG, WEB_GREEN_TAG, API_BLUE_TAG and API_GREEN_TAG, and
# the sync server's from SYNC_TAG and the MCP server's from MCP_TAG, each `latest` when unset.
# backup-db and backup-store, under the `backup` profile, are run only by deploy/backup.sh and
# deploy/restore.sh. Settings come from the .env, whose names deploy/env.example lists; each service
# gets only the ones it reads.
#
# The capacity limits are settings too, each listed below with the value it takes when the .env leaves
# it out, which is the app's own default. An app refuses to start on a value that isn't a whole number
# in its range, and a deploy then leaves its previous version serving.
#
# Memory caps sit above what each container used idle and with a design open; the MCP server's is
# about 140 MB plus up to 29 MB for each of its 30 agent tabs. They are ceilings, not use. With one
# colour of the web app and API, they add up to 3520 MB: Caddy 128 MB, the router 64 MB, web 384 MB, API 512 MB, sync 1024 MB, MCP 1024 MB and
# Postgres 384 MB. Only while both colours run, as during a swap, do they pass the server's 3915 MB, at
# 4416 MB, with 2 GB of swap behind them. The backup's two containers, 128 MB each, run one at a time
# and only for a backup or a restore. Move to a bigger server when available memory stays under 1 GB.
# On the one CPU, the MCP server gets a quarter of the others' weight (cpu_shares), so people's editing
# goes first when it is busy.
name: dazbee

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-web: &web
  restart: unless-stopped
  logging: *logging
  mem_limit: 384m
  # A stop lets the requests the colour holds end.
  stop_grace_period: 30s
  environment:
    NODE_ENV: production
    API_URL: http://caddy:8080
    SYNC_URL: wss://sync.dazbee.com
    # The public base URL, which names the MCP server's address in Settings.
    PUBLIC_URL: https://app.dazbee.com
    SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
    PILOT_HOST: ${PILOT_HOST:-pilot.dazbee.com}
    TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}

x-api: &api
  restart: unless-stopped
  logging: *logging
  mem_limit: 512m
  # A stop lets the requests the colour holds end.
  stop_grace_period: 30s
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://dazbee:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/dazbee
    SYNC_TOKEN_SECRET: ${SYNC_TOKEN_SECRET:?set SYNC_TOKEN_SECRET in .env}
    SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
    WORKOS_API_KEY: ${WORKOS_API_KEY:-}
    WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
    WORKOS_REDIRECT_URI: ${WORKOS_REDIRECT_URI:-}
    STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?set STORAGE_ENDPOINT in .env}
    STORAGE_BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET in .env}
    STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?set STORAGE_ACCESS_KEY_ID in .env}
    STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?set STORAGE_SECRET_ACCESS_KEY in .env}
    STORAGE_REGION: auto
    ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
    ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    # Pixabay's key, which turns agents' stock photo search on; empty leaves it off.
    PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
    # Agents' sign-ins one address may start in an hour, and client registrations in all in an hour.
    AGENT_SIGN_INS_PER_HOUR: ${AGENT_SIGN_INS_PER_HOUR:-60}
    AGENT_REGISTRATIONS_PER_HOUR: ${AGENT_REGISTRATIONS_PER_HOUR:-500}
  depends_on:
    postgres:
      condition: service_healthy

services:
  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    command: ['caddy', 'run', '--config', '/etc/caddy/deploy/Caddyfile', '--adapter', 'caddyfile']
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # A folder, not a file, so a new copy of deploy/ is what a reload reads.
      - ./deploy:/etc/caddy/deploy:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config

  # Sends the web app's and API's requests to their live colours (deploy/router.Caddyfile).
  router:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    command: ['caddy', 'run', '--config', '/etc/caddy/deploy/router.Caddyfile', '--adapter', 'caddyfile']
    volumes:
      # Folders, not files, so a new copy of deploy/ or of live/upstreams.caddy is what a reload reads.
      - ./deploy:/etc/caddy/deploy:ro
      - ./live:/etc/caddy/live:ro

  web-blue:
    <<: *web
    image: ghcr.io/dazbee-ai/dazbee-web:${WEB_BLUE_TAG:-latest}
    profiles: [blue]

  web-green:
    <<: *web
    image: ghcr.io/dazbee-ai/dazbee-web:${WEB_GREEN_TAG:-latest}
    profiles: [green]

  api-blue:
    <<: *api
    image: ghcr.io/dazbee-ai/dazbee-api:${API_BLUE_TAG:-latest}
    profiles: [blue]

  api-green:
    <<: *api
    image: ghcr.io/dazbee-ai/dazbee-api:${API_GREEN_TAG:-latest}
    profiles: [green]

  sync:
    image: ghcr.io/dazbee-ai/dazbee-sync:${SYNC_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    # The cap is the V8 heap limit plus 256 MB for everything outside the heap.
    command: ['node', '--max-old-space-size=768', 'apps/sync/src/main.ts']
    mem_limit: 1024m
    # A stop folds every open design before the process exits.
    stop_grace_period: 60s
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://dazbee:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/dazbee
      SYNC_TOKEN_SECRET: ${SYNC_TOKEN_SECRET:?set SYNC_TOKEN_SECRET in .env}
      # The design bytes held loaded at once, in MB; the designs kept loaded with no tab, and for how
      # many seconds.
      SYNC_LOADED_MB: ${SYNC_LOADED_MB:-200}
      SYNC_IDLE_DESIGNS: ${SYNC_IDLE_DESIGNS:-50}
      SYNC_IDLE_SECONDS: ${SYNC_IDLE_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy

  # The MCP server agents connect to (ADR-0019), which Caddy sends app.dazbee.com's /mcp, /oauth/* and
  # /.well-known/oauth-* to. It holds no secret and no database: it calls the API and the sync server
  # on their private addresses with each agent's own token.
  mcp:
    image: ghcr.io/dazbee-ai/dazbee-mcp:${MCP_TAG:-latest}
    restart: unless-stopped
    # Its log, a JSON line for each tool call and for each MCP session opened and ended, goes to the
    # server's journal, which keeps it when the container is made again: `journalctl -t dazbee-mcp`
    # reads every container's, `docker compose logs mcp` only the running one's.
    logging:
      driver: journald
      options:
        tag: dazbee-mcp
    mem_limit: 1024m
    # A quarter of the default 1024, so the web app, the API and the sync server go first on a busy CPU.
    cpu_shares: 256
    # A stop ends every agent's session; its client starts a new one.
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      API_URL: http://caddy:8080
      SYNC_URL: ws://sync:1234
      PUBLIC_URL: https://app.dazbee.com
      # Agent tabs open at once, and those one agent access may have open.
      MCP_AGENT_TABS: ${MCP_AGENT_TABS:-30}
      MCP_AGENT_TABS_PER_ACCESS: ${MCP_AGENT_TABS_PER_ACCESS:-1}
      # MCP sessions in all, those one access may hold, and the minutes an unused one lives.
      MCP_SESSIONS: ${MCP_SESSIONS:-200}
      MCP_SESSIONS_PER_ACCESS: ${MCP_SESSIONS_PER_ACCESS:-4}
      MCP_SESSION_IDLE_MINUTES: ${MCP_SESSION_IDLE_MINUTES:-30}
      # Each access's calls: so many at once, then so many each second.
      MCP_CALLS_BURST: ${MCP_CALLS_BURST:-60}
      MCP_CALLS_PER_SECOND: ${MCP_CALLS_PER_SECOND:-2}
      # Each access's renders: so many at once, then one every so many seconds; and the renders that may
      # wait in the process.
      MCP_RENDERS_BURST: ${MCP_RENDERS_BURST:-10}
      MCP_RENDER_EVERY_SECONDS: ${MCP_RENDER_EVERY_SECONDS:-6}
      MCP_RENDERS_WAITING: ${MCP_RENDERS_WAITING:-8}
      # The new designs one access may make in an hour.
      MCP_DESIGNS_PER_HOUR: ${MCP_DESIGNS_PER_HOUR:-30}

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 384m
    environment:
      POSTGRES_USER: dazbee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dazbee
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dazbee -d dazbee']
      interval: 30s
      start_period: 60s
      start_interval: 1s
      timeout: 3s
      retries: 3

  # Postgres's client tools for deploy/backup.sh and deploy/restore.sh, run one-off with compose's
  # `run`: they connect over the network as the apps do, so a dump's memory isn't Postgres's.
  backup-db:
    image: postgres:16-alpine
    profiles: [backup]
    logging: *logging
    mem_limit: 128m
    environment:
      PGHOST: postgres
      PGUSER: dazbee
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: dazbee

  # rclone for deploy/backup.sh and deploy/restore.sh, run one-off with compose's `run`, configured
  # from the .env with no config file: the remote `backups:` is the backups bucket.
  backup-store:
    image: rclone/rclone:1.76.0
    profiles: [backup]
    logging: *logging
    mem_limit: 128m
    environment:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${R2_BACKUP_ENDPOINT:-}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_BACKUP_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_BACKUP_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_REGION: auto
      # The key is limited to the bucket, so rclone must not try to make it.
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
      RCLONE_CONFIG_BACKUPS_TYPE: alias
      RCLONE_CONFIG_BACKUPS_REMOTE: r2:${R2_BACKUP_BUCKET:-}

volumes:
  postgres:
  caddy-data:
  caddy-config:

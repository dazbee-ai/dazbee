<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Northwind Studio — Furniture for small rooms</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="stylesheet" href="https://cdn.northwind.test/css/app.4f9a1c.css" />
    <style>
      .announcement {
        background-color: #f59e0b;
        color: #111827;
      }
    </style>
  </head>
  <body class="font-sans text-gray-900 bg-white">
    <div class="announcement">Free delivery this week</div>
    <header class="flex items-center justify-between px-8 py-4">
      <a href="/" class="flex items-center">
        <img src="/img/northwind-logo.png" alt="Northwind Studio" width="160" height="40" />
      </a>
      <nav class="flex gap-6 text-gray-600">
        <a href="/chairs">Chairs</a>
        <a href="/tables">Tables</a>
        <a href="/journal">Journal</a>
      </nav>
      <a href="/cart" class="rounded-lg bg-indigo-700 px-4 py-2 text-white">Cart</a>
    </header>
    <main>
      <section class="px-8 py-24">
        <h1 class="font-display text-6xl text-gray-900">Furniture for small rooms.</h1>
        <p class="text-gray-600">Designed in Oslo, made to fold away.</p>
        <a href="/chairs" class="rounded-lg bg-indigo-700 px-6 py-3 text-white">Shop chairs</a>
        <a href="/journal" class="rounded-lg border border-indigo-700 px-6 py-3 text-indigo-700">Read the journal</a>
      </section>
      <section class="grid grid-cols-3 gap-8 px-8">
        <article class="rounded-2xl bg-gray-100 p-6">
          <img src="/img/chair.jpg" alt="Fold chair" />
          <h2 class="font-display text-2xl">Fold chair</h2>
          <span class="text-indigo-700">$240</span>
        </article>
        <article class="rounded-2xl bg-gray-100 p-6">
          <img src="/img/table.jpg" alt="Drop-leaf table" />
          <h2 class="font-display text-2xl">Drop-leaf table</h2>
          <span class="text-indigo-700">$520</span>
        </article>
        <article class="rounded-2xl bg-gray-100 p-6">
          <img src="/img/stool.jpg" alt="Stack stool" />
          <h2 class="font-display text-2xl">Stack stool</h2>
          <span class="text-indigo-700">$120</span>
        </article>
      </section>
    </main>
    <footer class="bg-gray-900 px-8 py-12 text-white">Northwind Studio</footer>
  </body>
</html>

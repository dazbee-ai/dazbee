name: CI

on:
  # A branch's commits are tested by its pull request; pushes are tested on main only, so no commit runs twice.
  push:
    branches: [main]
  pull_request:

# A newer commit cancels a pull request's run; on main every run finishes, so each merge pushes its images whole.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ubuntu-archive
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # hb-shape, the reference the shaping checks (#7) compare Skia's glyphs against.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libharfbuzz-bin
      - run: pnpm lint
      - run: pnpm typecheck
      # Fails when tables.ts holds a change that packages/db/migrations has no migration for, or one
      # drizzle-kit would ask about (a rename); drizzle-kit itself is stopped after 60 s.
      - run: pnpm --filter @dazbee/db migration:check
        timeout-minutes: 2
      # Postgres, the API, the sync server and the worker, from this checkout: the API's seam tests (#33) and the
      # sync server's run against them, and the API runs the migrations on start.
      - run: docker compose up -d --wait
      # The matchers' files from their release, checked by SHA-256, kept between runs until release.json changes.
      - uses: actions/cache@v6
        with:
          path: packages/matchers/.files
          key: matcher-files-${{ hashFiles('packages/matchers/src/release.json') }}
      - run: pnpm --filter @dazbee/matchers files
      - run: pnpm test
      # An upload of reports gets three minutes.
      - if: failure()
        uses: actions/upload-artifact@v7
        timeout-minutes: 3
        with:
          name: pixel-diffs
          path: tests/pixels/output
          if-no-files-found: ignore
          retention-days: 7

  # The production images: built, run with deploy/compose.yml behind Caddy with a test .env and a
  # self-signed certificate, checked, and deployed over each other with deploy/deploy.sh. On main they
  # are pushed to GitHub's container registry.
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/dazbee-ai
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          file: apps/web/Dockerfile
          build-args: BUILD_ID=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/dazbee-web:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - uses: docker/build-push-action@v7
        with:
          file: apps/api/Dockerfile
          build-args: BUILD_ID=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/dazbee-api:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v7
        with:
          file: apps/sync/Dockerfile
          build-args: BUILD_ID=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/dazbee-sync:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=sync
          cache-to: type=gha,scope=sync,mode=max
      - uses: docker/build-push-action@v7
        with:
          file: apps/mcp/Dockerfile
          build-args: BUILD_ID=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/dazbee-mcp:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,scope=mcp,mode=max
      - uses: docker/build-push-action@v7
        with:
          file: apps/worker/Dockerfile
          build-args: BUILD_ID=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/dazbee-worker:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      # The folder compose runs in, laid out as /opt/dazbee is on the server.
      - name: Start the stack
        run: |
          stack="$RUNNER_TEMP/stack"
          mkdir -p "$stack/live" "$stack/certs"
          cp -r deploy "$stack/deploy"
          cp deploy/upstreams.caddy "$stack/live/upstreams.caddy"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=app.dazbee.com             -addext subjectAltName=DNS:app.dazbee.com,DNS:sync.dazbee.com             -keyout "$stack/certs/origin.key" -out "$stack/certs/origin.pem"
          chmod 644 "$stack/certs/origin.key"
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "SYNC_TOKEN_SECRET=$(openssl rand -hex 32)"
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "STORAGE_ENDPOINT=http://storage.invalid"
            echo "STORAGE_BUCKET=dazbee"
            echo "STORAGE_ACCESS_KEY_ID=test"
            echo "STORAGE_SECRET_ACCESS_KEY=test"
            for name in WEB_BLUE_TAG WEB_GREEN_TAG API_BLUE_TAG API_GREEN_TAG SYNC_TAG MCP_TAG WORKER_TAG; do echo "$name=$GITHUB_SHA"; done
          } > "$stack/.env"
          cd "$stack"
          # Both colours at once: the migration lock keeps their APIs from migrating the new database together.
          docker compose -f deploy/compose.yml --project-directory . --profile blue --profile green up -d --wait
      - name: Check the stack
        working-directory: ${{ runner.temp }}/stack
        run: |
          compose() { docker compose -f deploy/compose.yml --project-directory . --profile blue --profile green "$@"; }
          https() { curl -sS --resolve app.dazbee.com:443:127.0.0.1 --resolve sync.dazbee.com:443:127.0.0.1 --cacert certs/origin.pem "$@"; }
          for service in web-blue web-green api-blue api-green sync mcp worker postgres; do
            read -r health ports < <(docker inspect -f '{{.State.Health.Status}} {{len .HostConfig.PortBindings}}' "$(compose ps -q "$service")")
            echo "$service: $health, $ports published ports"
            [ "$health" = healthy ]
            [ "$ports" = 0 ]
          done
          page=$(https -f https://app.dazbee.com/login)
          grep -q "data-build=\"$GITHUB_SHA\"" <<< "$page"
          echo "/login renders through Caddy, on build $GITHUB_SHA"
          [ "$(https -o /dev/null -w '%{http_code} %{redirect_url}' https://app.dazbee.com/)" = "303 https://app.dazbee.com/login" ]
          echo "/ without a session is sent to /login"
          https -f -o /dev/null https://sync.dazbee.com/
          echo "the sync server answers through Caddy"
          https -f https://app.dazbee.com/.well-known/oauth-authorization-server | grep -q '"issuer":"https://app.dazbee.com"'
          https -f https://app.dazbee.com/.well-known/oauth-protected-resource/mcp | grep -q '"resource":"https://app.dazbee.com/mcp"'
          [ "$(https -o /dev/null -w '%{http_code}' -X POST https://app.dazbee.com/mcp)" = 401 ]
          echo "the MCP server answers /mcp and its OAuth metadata through Caddy"
          upload=https://app.dazbee.com/uploads/$(printf 'x%.0s' {1..43})
          https -X PUT --data-binary x "$upload" | grep -q 'not an upload link Dazbee gave'
          head -c $((31 * 1024 * 1024 + 1)) /dev/zero > "$RUNNER_TEMP/too-big"
          https -T "$RUNNER_TEMP/too-big" -w ' %{http_code}' "$upload" | grep -q 'The file is over 30 MB.* 413$'
          [ "$(https -o /dev/null -w '%{http_code}' "$upload")" = 404 ]
          echo "a PUT to /uploads/* reaches the API through Caddy, which cuts off a body past 31 MiB with a sentence; a GET does not"
          https -sD - https://app.dazbee.com/fonts/google/faces/nosuchface00.ttf | tr -d '\r' > "$RUNNER_TEMP/font"
          grep -q '^HTTP/[0-9.]* 404' "$RUNNER_TEMP/font"
          grep -qi '^cache-control: no-store$' "$RUNNER_TEMP/font"
          grep -q '"error":"No such font"' "$RUNNER_TEMP/font"
          https -sD - https://app.dazbee.com/fonts/google/lists/00000000000000000000000000000000.js | tr -d '\r' > "$RUNNER_TEMP/list"
          grep -q '^HTTP/[0-9.]* 404' "$RUNNER_TEMP/list"
          grep -qi '^cache-control: no-store$' "$RUNNER_TEMP/list"
          grep -q '"error":"No such list"' "$RUNNER_TEMP/list"
          echo "a GET of /fonts/google/* reaches the API through Caddy, and a list of another version is kept nowhere"
          https -sD - "https://app.dazbee.com/matchers/$(printf '0%.0s' {1..64}).bin" | tr -d '\r' > "$RUNNER_TEMP/matcher"
          grep -q '^HTTP/[0-9.]* 404' "$RUNNER_TEMP/matcher"
          grep -qi '^cache-control: no-store$' "$RUNNER_TEMP/matcher"
          grep -q '"error":"No such file"' "$RUNNER_TEMP/matcher"
          echo "a GET of /matchers/* reaches the API through Caddy, and an unlisted file is kept nowhere"
          https -fsD - -o /dev/null https://app.dazbee.com/vendor/fonts/NotoSans-Regular.ttf | grep -qi '^cache-control: public, max-age=31536000, immutable'
          echo "the vendored files are kept for good"
          health=$(compose exec -T worker node -e "fetch('http://localhost:8790/health').then(r => r.text()).then(console.log)")
          grep -q "\"build\":\"$GITHUB_SHA\"" <<< "$health"
          echo "worker/health names build $GITHUB_SHA"
          health=$(compose exec -T caddy wget -qO- http://mcp:3100/health)
          grep -q "\"build\":\"$GITHUB_SHA\"" <<< "$health"
          echo "mcp/health names build $GITHUB_SHA"
          for api in caddy:8080 api-blue:8787 api-green:8787; do
            health=$(compose exec -T caddy wget -qO- "http://$api/health")
            grep -q "\"build\":\"$GITHUB_SHA\"" <<< "$health"
            echo "$api/health names build $GITHUB_SHA"
          done
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The probe's packages: the deploy check runs it in a Node container with this checkout.
      - run: pnpm install --frozen-lockfile --filter @dazbee/deploy-check...
      # deploy.sh swaps the stack's apps while the probe asks the web app and the API every 100 ms
      # and holds a tab open on the sync server; an image whose health check fails is left unserved.
      - name: Deploy while the probe asks
        run: tests/deploy/check.sh "$RUNNER_TEMP/stack" "$GITHUB_SHA"
      # backup.sh dumps the stack's database to an S3 stand-in while rows are written, and restore.sh
      # restores it with the counts of its snapshot, refuses the live database without --live, and
      # with it replaces the live database once nothing is connected.
      - name: Back up and restore
        run: tests/deploy/backup-check.sh "$RUNNER_TEMP/stack"
      - if: failure()
        working-directory: ${{ runner.temp }}/stack
        run: |
          docker compose -f deploy/compose.yml --project-directory . --profile blue --profile green logs --no-color --tail 200
          docker logs dazbee-deploy-probe || true
          docker logs dazbee-backup-store || true
      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: env.PUSH == 'true'
        name: Push the images
        run: |
          for app in web api sync mcp worker; do
            docker tag "$REGISTRY/dazbee-$app:$GITHUB_SHA" "$REGISTRY/dazbee-$app:latest"
            docker push "$REGISTRY/dazbee-$app:$GITHUB_SHA"
            docker push "$REGISTRY/dazbee-$app:latest"
          done

  # The Python workspace (python/): ruff, the layer split app's module imported with no GPU, its tests (pytest),
  # and the app's contract written again from packages/schema, which fails when python/layering/contract.py is
  # stale (ADR-0002).
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @dazbee/schema...
      - run: uv sync --directory python --frozen --all-packages
      - run: uv run --directory python --frozen ruff check .
      - run: uv run --directory python --frozen ruff format --check .
      - run: uv run --directory python/layering --frozen python -c 'import app'
      - run: uv run --directory python --frozen pytest
      - run: pnpm --filter @dazbee/schema python-models:check

  # The one check a pull request needs: the tests, the images and the Python checks all passed.
  check:
    needs: [tests, images, python]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: >-
          [ "${{ needs.tests.result }}" = success ] && [ "${{ needs.images.result }}" = success ] &&
          [ "${{ needs.python.result }}" = success ]
